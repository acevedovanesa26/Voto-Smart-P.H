services:
  - type: web
    name: votosmart-colombia
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: votosmart-db
          property: connectionString

databases:
  - name: votosmart-db
    plan: free
    databaseName: votosmart
    user: votosmart_user
